#
# CI: lint and test every PR to main, and re-run on every push to main.
#
# Security rules (see CLAUDE.md):
#   - Never pull_request_target: fork PRs must never run with secrets or a write token.
#   - This workflow references NO secrets. Nothing here can leak regardless of PR code.
#   - Least privilege: no permissions by default, read-only contents per job.
#   - Third-party actions pinned to full commit SHAs (Dependabot keeps them current).
#
# Job names are the required status checks on main — keep them stable.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make sync
      # web-ext lint (warnings fail too), tsc and prettier --check.
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make sync
      - run: make test

  reuse-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every file has copyright and licence information (REUSE): a header, or REUSE.toml.
      - run: make reuse-lint

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
      # gitleaks via its official image, pinned by digest in the Makefile.
      - run: make secrets-scan
