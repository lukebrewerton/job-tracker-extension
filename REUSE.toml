version = 1

[[annotations]]
path = "src/icons/*.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 Luke Brewerton"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

# Everything else that can't carry a comment. Listed by name, not by glob, so a new file
# without licence information still fails `make reuse-lint`: give it a header, or add it here.
[[annotations]]
path = [
  "src/manifest.json",
  "package.json",
  "package-lock.json",
  ".nvmrc",
  "README.md",
  "CLAUDE.md",
]
